<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Quantico&family=Silkscreen&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
  </head>
  <body>
    <div id="newtab">
      <h3 id="timetext"></h3>
      <div id="iamweather">
        <div id="weather-icon" aria-label="Weather icon">🌤️</div>
      <div id="weathercontent">Loading...</div>
      </div>
      
      <h1 id="tabtext">KuuppaTab</h1>
    <form id="searchBar">
        <input id="searchInput" type="text" placeholder="Search anything..." autocomplete="off"/>
        <button id="searchButton" type="submit"><img src="./src/assets/search.png" style="width: 50px; height: 40px; position: relative; top: 50%; left: 50%; transform: translate(-50%, -50%);"></button>
    </form>
    <div id="quickLinks"></div>
    <div id="quickLinkMod" class="quickLinkMod">
    <div class="quickLinkModContent">
        <h2 id="quickLinkModTitle">Add Quick Link</h2>
        <input id="quickLinkName" type="text" placeholder="Name" autocomplete="off">

        <input id="quickLinkUrl" type="url" placeholder="https://example.com" autocomplete="off">
        <input id="quickLinkIcon" type="url" placeholder="https://example.com" autocomplete="off" style="display: none;">
        <div class="quickLinkModButtons">
            <button id="quickLinkCancel">Cancel</button>
            <button id="quickLinkSave">Save</button>
        </div>
        <button id="quickLinkDelete" class="quickLinkDelete">Delete</button>
    </div>
</div>
    </div>
    
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
